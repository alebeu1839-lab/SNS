name: claude-handoff-selftest
on:
  pull_request:
    paths:
      - 'scripts/test-claude-handoff*.mjs'
      - '.github/workflows/claude-handoff-selftest.yml'
  push:
    paths:
      - 'scripts/test-claude-handoff*.mjs'
      - '.github/workflows/claude-handoff-selftest.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/test-claude-handoff.mjs
      - run: node scripts/test-claude-handoff-selftest.mjs
